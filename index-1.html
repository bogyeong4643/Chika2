<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>꼬꼬&amp;미미 치카표</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light only">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --card:#FFFFFF; --ink:#4A2F25; --soft:#8A7468; --line:#A8D8F5;
  --blue:#1E96E6; --blueSoft:#DDF0FD; --pink:#FF6B9E; --pinkSoft:#FFE3EE; --sun:#FFC83D;
  --empty:#E4F2FC; --todayRing:#FFC83D;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.jua{font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:400}
.wrap{max-width:560px;margin:0 auto;padding:18px 14px 36px}

header{display:grid;grid-template-columns:72px 1fr 72px;align-items:end;gap:8px}
.ava{width:72px;height:88px;border-radius:22px;background:#F6EEDF;overflow:hidden;border:3px solid var(--line)}
.ava img{width:100%;height:100%;object-fit:contain;padding:6px;display:block}
h1{margin:0;text-align:center;line-height:1.05}
h1 .names{display:block;font-size:clamp(1.25rem,6vw,1.7rem);color:var(--ink)}
h1 .big{display:block;font-size:clamp(2.3rem,12vw,3.2rem);color:var(--blue);letter-spacing:.02em}
h1 .names b{font-weight:400;color:var(--pink)}

.tabs{display:flex;background:var(--card);border:3px solid var(--line);border-radius:999px;padding:4px;margin:16px 0 14px}
.tabs button{flex:1;font:inherit;font-family:"Jua",sans-serif;font-size:1.1rem;border:none;background:none;color:var(--soft);padding:10px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--blue);color:#fff}

.dateline{font-size:1.25rem;margin:2px 4px 10px}
.cat{background:var(--card);border:3px solid var(--line);border-radius:26px;padding:14px;margin-bottom:12px}
.cat-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.cat-top .ava{width:56px;height:64px;border-radius:16px}
.cat-name{font-size:1.4rem;line-height:1.1}
.age{font-family:"Gowun Dodum",sans-serif;font-size:.72rem;color:var(--soft);margin-left:4px;white-space:nowrap}
.cat-goal{font-size:.9rem;color:var(--soft)}
.status{margin-left:auto;text-align:right;font-size:.95rem;line-height:1.3}
.status .jua{font-size:1.05rem}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{font:inherit;font-family:"Jua",sans-serif;font-size:1.05rem;color:var(--soft);background:#E4F2FC;border:3px solid transparent;border-radius:18px;padding:12px 4px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:84px;justify-content:center}
.slot .ic{font-size:1.7rem;line-height:1;height:2.1rem;display:flex;align-items:center;justify-content:center}
.slot .ic:empty::before{content:"";display:block;width:1.2rem;height:1.2rem;border-radius:50%;background:#FFFFFF;border:2.5px solid var(--line);box-sizing:border-box;margin-top:.25rem}
.k .slot.on{border-style:solid;border-color:var(--blue);background:var(--blueSoft);color:var(--ink)}
.m .slot.on{border-style:solid;border-color:var(--pink);background:var(--pinkSoft);color:var(--ink)}
.slot.on .ic{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(0) rotate(-25deg)}100%{transform:scale(1)}}
.done-k{color:var(--blue)} .done-m{color:var(--pink)}

.monthnav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 10px}
.round{font:inherit;font-family:"Jua",sans-serif;font-size:1rem;color:var(--ink);background:var(--card);border:3px solid var(--line);border-radius:999px;width:46px;height:46px;cursor:pointer}
.monthnav .label{font-size:1.35rem}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.sum{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.sum .ava{width:40px;height:46px;border-radius:12px}
.sum .n{font-size:1.45rem;line-height:1.2;padding-top:4px;letter-spacing:.03em}
.sum small{display:block;color:var(--soft);font-size:.8rem;margin-top:2px}
.cal{background:var(--card);border:3px solid var(--line);border-radius:24px;padding:10px 8px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wk.head div{text-align:center;font-size:.9rem;color:var(--soft);padding:2px 0 6px}
.wk.head div:first-child{color:var(--pink)}
.wk.head div:last-child{color:var(--blue)}
.cell{font:inherit;background:none;border:2px solid transparent;border-radius:14px;padding:5px 0 6px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink);cursor:pointer;min-height:62px}
.cell .d{font-size:.95rem}
.cell.today{border-color:var(--todayRing)}
.cell.future{opacity:.35;cursor:default}
.cell.blank{visibility:hidden}
.paws{display:flex;gap:2px}
.paw{width:17px;height:17px;fill:var(--empty)}
.paw.k{fill:var(--blue)} .paw.m{fill:var(--pink)}
.legend{display:flex;gap:16px;justify-content:center;margin-top:10px;font-size:.88rem;color:var(--soft);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:4px}

.motto{margin:22px 4px 0;padding:0;list-style:none}
.motto li{display:flex;gap:8px;align-items:flex-start;margin:8px 0;font-size:1.02rem;color:var(--blue)}
.motto li svg{flex:none;width:20px;height:20px;fill:var(--blue);margin-top:2px}
.motto li.love{color:var(--ink)} .motto li.love svg{fill:var(--pink)}
.motto b{font-weight:inherit}

dialog{border:3px solid var(--line);border-radius:26px;background:var(--bg);color:var(--ink);padding:16px;width:min(94vw,440px)}
dialog::backdrop{background:rgba(22,32,46,.5)}
dialog h2{margin:0 0 10px;font-size:1.3rem}
.dclose{display:flex;justify-content:flex-end;margin-top:4px}
.btn{font-family:"Jua",sans-serif;font-size:1.05rem;border:none;border-radius:999px;padding:10px 22px;cursor:pointer;background:var(--blue);color:#fff}

button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
[hidden]{display:none!important}
#login{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
#login img{width:180px;height:180px;border-radius:36px;border:3px solid var(--line)}
#login h2{margin:0;font-size:2rem;color:var(--blue)}
#login p{margin:0;color:var(--soft);line-height:1.5}
.gbtn{font-family:"Jua",sans-serif;font-size:1.15rem;border:none;border-radius:999px;padding:14px 28px;cursor:pointer;background:var(--blue);color:#fff}
.who{text-align:center;font-size:.82rem;color:var(--soft);margin-top:18px}
.who button{font:inherit;color:var(--soft);background:none;border:none;text-decoration:underline;cursor:pointer;padding:4px}
.sync{margin:-6px 4px 10px;font-size:.85rem;color:var(--soft);text-align:center}
.sync.ro{color:var(--pink)}
.slot:disabled{cursor:default}
@media (prefers-reduced-motion:reduce){.slot.on .ic{animation:none}}
</style>
</head>

    </div>
    <div class="legend">
      <span><svg class="paw k"><use href="#paw"/></svg>꼬꼬 완료</span>
      <span><svg class="paw m"><use href="#paw"/></svg>미미 완료</span>
    </div>
    <p style="text-align:center;color:var(--soft);font-size:.88rem;margin:6px 0 0">하루에 한 번만 해도 발자국이 찍혀요.<br>날짜를 누르면 기록을 수정할 수 있어요.</p>
  </section>

  <ul class="motto">
    <li class="love"><svg><use href="#heart"/></svg>후회하지 말고, 예방을 잘 하자.</li>
    <li class="love"><svg><use href="#heart"/></svg>수면마취 할 상황을 내 손으로 만들지 말자.</li>
    <li class="love"><svg><use href="#heart"/></svg><span><b>꼬꼬</b>와 <b>미미</b>를 어제보다 오늘 더 사랑하자.</span></li>
  </ul>
  <p class="who" id="who"></p>
</div>

<dialog id="dayDlg">
  <h2 class="jua" id="dayTitle"></h2>
  <div id="dayCats"></div>
  <div class="dclose"><button class="btn" id="dayClose">다 했어요</button></div>
</dialog>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const KEY='kkomimi-chika-v2';
const TOOTH='<svg viewBox="0 0 40 40" width="34" height="34" aria-hidden="true"><path d="M20 7C14 3 6 5 6 13C6 19 9 22 10 28C11 35 15 36 16 30L17 25.5C18 23.5 22 23.5 23 25.5L24 30C25 36 29 35 30 28C31 22 34 19 34 13C34 5 26 3 20 7Z" fill="#FFFFFF" stroke="#9A7B68" stroke-width="2.2" stroke-linejoin="round"/><circle cx="15" cy="15" r="1.8" fill="#6B5244"/><circle cx="25" cy="15" r="1.8" fill="#6B5244"/><path d="M17.5 18.5Q20 20.8 22.5 18.5" stroke="#6B5244" stroke-width="1.6" fill="none" stroke-linecap="round"/><ellipse cx="12" cy="18.5" rx="2.2" ry="1.3" fill="#FFCAD3"/><ellipse cx="28" cy="18.5" rx="2.2" ry="1.3" fill="#FFCAD3"/><path d="M34 1L35.3 4.7L39 6L35.3 7.3L34 11L32.7 7.3L29 6L32.7 4.7Z" fill="#FFC83D"/><path d="M5 1.5L5.8 3.7L8 4.5L5.8 5.3L5 7.5L4.2 5.3L2 4.5L4.2 3.7Z" fill="#FFC83D"/></svg>';
const CATS=[
  {id:'k',name:'꼬꼬',goal:1,birth:[2016,5,25],img:document.querySelector('header .ava img[alt="꼬꼬"]').src,icon:TOOTH},
  {id:'m',name:'미미',goal:2,birth:[2020,7,30],img:document.querySelector('header .ava img[alt="미미"]').src,icon:TOOTH}
];
function ageText(b){
  const t=new Date();let m=(t.getFullYear()-b[0])*12+(t.getMonth()+1-b[1]);
  if(t.getDate()<b[2])m--;
  return '만 '+Math.floor(m/12)+'살 '+(m%12)+'개월';
}
const SLOTS=[['a','아침'],['l','점심'],['e','저녁']];
const WD=['일','월','화','수','목','금','토'];

let marks={};
let canWrite=true;
const setSync=(t,ro)=>{const el=document.getElementById('sync');el.textContent=t;el.classList.toggle('ro',!!ro)};

let auth,fs,col;const PREVIEW_OK=!!window.firebase;
const chains={};
function writeDoc(date,cat){
  if(!PREVIEW_OK)return;
  const id=date+'_'+cat;
  const o=Object.assign({},((marks[date]||{})[cat])||{});
  const ref=col.doc(id);
  const run=()=>{
    const any=SLOTS.some(s=>o[s[0]]);
    return (any?ref.set({date,cat,a:!!o.a,l:!!o.l,e:!!o.e}):ref.delete()).catch(err=>{
      if(err&&err.code==='permission-denied'){canWrite=false;setSync('이 계정은 기록할 수 없어요',true);render()}
      else setSync('저장이 잠깐 안 됐어요. 다시 눌러 주세요',true);
    });
  };
  chains[id]=(chains[id]||Promise.resolve()).then(run);
}

if(PREVIEW_OK){
firebase.initializeApp({
  apiKey:"AIzaSyBiusRnSteJKlxxD33tl9AWjWaD7OiF1SI",
  authDomain:"rhrh-9edca.firebaseapp.com",
  projectId:"rhrh-9edca",
  storageBucket:"rhrh-9edca.firebasestorage.app",
  messagingSenderId:"24949150122",
  appId:"1:24949150122:web:7a228fa1dc19a526ce5bd3"
});
auth=firebase.auth();fs=firebase.firestore();
try{fs.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
col=fs.collection('brush');

let unsub=null;
const loginEl=document.getElementById('login');
document.getElementById('loginBtn').onclick=()=>{
  const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
  auth.signInWithPopup(p).catch(e=>{
    if(e&&(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'))auth.signInWithRedirect(p);
    else if(e&&e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')document.getElementById('loginMsg').textContent='로그인이 안 됐어요. 다시 눌러 주세요.';
  });
};
auth.onAuthStateChanged(u=>{
  if(unsub){unsub();unsub=null}
  if(!u){loginEl.hidden=false;document.getElementById('who').textContent='';return}
  loginEl.hidden=true;canWrite=true;
  document.getElementById('who').innerHTML='';
  const w=document.getElementById('who');w.append(u.email+'로 로그인했어요 ');
  const lo=document.createElement('button');lo.textContent='로그아웃';lo.onclick=()=>auth.signOut();w.append(lo);
  setSync('불러오는 중…');
  unsub=col.orderBy('date','desc').limit(1000).onSnapshot(snap=>{
    const m={};
    snap.forEach(doc=>{const v=doc.data();if(!v||!v.date||!v.cat)return;
      const o={};SLOTS.forEach(s=>{if(v[s[0]])o[s[0]]=1});
      if(Object.keys(o).length){(m[v.date]||(m[v.date]={}))[v.cat]=o}});
    marks=m;
    if(canWrite)setSync('뽀뽀와 또또가 함께 기록하는 치카표예요.');
    render();
  },err=>{
    if(err&&err.code==='permission-denied'){
      auth.signOut();loginEl.hidden=false;
      document.getElementById('loginMsg').textContent='이 계정('+u.email+')은 치카표에 등록되지 않았어요. 뽀뽀나 또또 계정으로 로그인해 주세요.';
    }else setSync('연결이 끊겼어요. 앱을 다시 열어 주세요',true);
  });
});
}else{
  setSync('미리보기 화면이에요. 여기서 누른 기록은 저장되지 않아요.',true);
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const now=new Date();const TODAY=keyOf(now);
let viewY=now.getFullYear(),viewM=now.getMonth();

const count=(k,c)=>{const o=(marks[k]||{})[c]||{};return SLOTS.filter(s=>o[s[0]]).length};
function streak(c){
  let n=0;const d=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  if(!count(keyOf(d),c))d.setDate(d.getDate()-1);
  while(count(keyOf(d),c)){n++;d.setDate(d.getDate()-1)}
  return n;
}

function catCards(k,showStreak){
  return CATS.map(c=>{
    const o=(marks[k]||{})[c.id]||{};const n=count(k,c.id);
    let st;
    if(!n)st='<span class="jua" style="color:var(--soft)">치카 전</span>';
    else if(n>=c.goal)st='<span class="jua done-'+c.id+'">'+'치카 완료'+'</span>';
    else st='<span class="jua done-'+c.id+'">치카 완료</span><br><span style="color:var(--soft)">목표까지 '+(c.goal-n)+'번 더</span>';
    if(showStreak){const s=streak(c.id);if(s>1)st+='<br><span style="color:var(--soft)">'+s+'일째 연속</span>'}
    return '<div class="cat '+c.id+'"><div class="cat-top"><div class="ava"><img src="'+c.img+'" alt=""></div>'+
      '<div><div class="cat-name jua">'+c.name+'<span class="age">'+ageText(c.birth)+'</span></div><div class="cat-goal">하루 '+c.goal+'회 목표</div></div>'+
      '<div class="status">'+st+'</div></div><div class="slots">'+
      SLOTS.map(s=>'<button class="slot'+(o[s[0]]?' on':'')+'" data-k="'+k+'" data-c="'+c.id+'" data-s="'+s[0]+'"'+(canWrite?'':' disabled')+' aria-pressed="'+!!o[s[0]]+'" aria-label="'+c.name+' '+s[1]+' 치카">'+
        '<span class="ic">'+(o[s[0]]?c.icon:'')+'</span>'+s[1]+'</button>').join('')+'</div></div>';
  }).join('');
}

function renderToday(){
  document.getElementById('todayLabel').textContent=(now.getMonth()+1)+'월 '+now.getDate()+'일 '+WD[now.getDay()]+'요일';
  document.getElementById('todayCats').innerHTML=catCards(TODAY,true);
}

function renderMonth(){
  document.getElementById('monthLabel').textContent=viewY+'년 '+(viewM+1)+'월';
  const isCur=viewY===now.getFullYear()&&viewM===now.getMonth();
  document.getElementById('nextM').style.visibility=isCur?'hidden':'visible';
  const first=new Date(viewY,viewM,1);const days=new Date(viewY,viewM+1,0).getDate();
  let h='';for(let i=0;i<first.getDay();i++)h+='<div class="cell blank"></div>';
  const tot={k:0,m:0};let elapsed=0;
  for(let d=1;d<=days;d++){
    const k=viewY+'-'+pad(viewM+1)+'-'+pad(d);const fut=k>TODAY;if(!fut)elapsed++;
    const paws=CATS.map(c=>{const ok=count(k,c.id)>0;if(ok)tot[c.id]++;return '<svg class="paw'+(ok?' '+c.id:'')+'"><use href="#paw"/></svg>'}).join('');
    const lbl=(viewM+1)+'월 '+d+'일, 꼬꼬 '+(count(k,'k')?'했음':'안 함')+', 미미 '+(count(k,'m')?'했음':'안 함');
    h+='<button class="cell'+(k===TODAY?' today':'')+(fut?' future':'')+'" data-day="'+k+'"'+(fut?' disabled':'')+' aria-label="'+lbl+'"><span class="d jua">'+d+'</span><span class="paws">'+paws+'</span></button>';
  }
  document.getElementById('grid').innerHTML=h;
  document.getElementById('summary').innerHTML=CATS.map(c=>'<div class="sum"><div class="ava"><img src="'+c.img+'" alt=""></div><span class="n jua done-'+c.id+'">'+c.name+'</span></div>').join('');
  }

function render(){renderToday();renderMonth();if(dlg.open)renderDay()}

document.addEventListener('click',e=>{
  const b=e.target.closest('.slot');if(!b)return;
  const {k,c,s}=b.dataset;const day=marks[k]||(marks[k]={});const o=day[c]||(day[c]={});
  if(!canWrite)return;
  if(o[s])delete o[s];else o[s]=1;
  writeDoc(k,c);
  if(!Object.keys(o).length)delete day[c];if(!Object.keys(day).length)delete marks[k];
  render();
});

const dlg=document.getElementById('dayDlg');let dlgKey=null;
function renderDay(){
  const [y,m,d]=dlgKey.split('-').map(Number);const dt=new Date(y,m-1,d);
  document.getElementById('dayTitle').textContent=m+'월 '+d+'일 '+WD[dt.getDay()]+'요일';
  document.getElementById('dayCats').innerHTML=catCards(dlgKey,false);
}
document.getElementById('grid').addEventListener('click',e=>{
  const c=e.target.closest('.cell');if(!c||c.disabled||!c.dataset.day)return;
  dlgKey=c.dataset.day;renderDay();dlg.showModal();
});
document.getElementById('dayClose').onclick=()=>dlg.close();

function show(which){
  const t=which==='today';
  document.getElementById('viewToday').hidden=!t;document.getElementById('viewMonth').hidden=t;
  document.getElementById('tabToday').setAttribute('aria-selected',t);document.getElementById('tabMonth').setAttribute('aria-selected',!t);
  if(!t){viewY=now.getFullYear();viewM=now.getMonth();renderMonth()}
}
document.getElementById('tabToday').onclick=()=>show('today');
document.getElementById('tabMonth').onclick=()=>show('month');
document.getElementById('prevM').onclick=()=>{viewM--;if(viewM<0){viewM=11;viewY--}renderMonth()};
document.getElementById('nextM').onclick=()=>{viewM++;if(viewM>11){viewM=0;viewY++}renderMonth()};
render();
// 켜둔 채로 날짜가 바뀌면 새 날짜로 다시 열기
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&keyOf(new Date())!==TODAY)location.reload()});
setInterval(()=>{if(!document.hidden&&keyOf(new Date())!==TODAY)location.reload()},60000);
</script>
</body>
</html>
